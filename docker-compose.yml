version: '3.8'

services:
  fraudguard-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=fraud_admin
      - POSTGRES_PASSWORD=fraud_secret
      - POSTGRES_DB=fraudguard_db
      - LLM_PROVIDER=mock
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=fraud_admin
      - POSTGRES_PASSWORD=fraud_secret
      - POSTGRES_DB=fraudguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
